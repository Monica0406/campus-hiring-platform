name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend Tests & Checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: campus_hiring_db
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        env:
          DB_NAME: campus_hiring_db
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: ci-test-secret-key-campus-hiring-platform-32chars
          DEBUG: "True"
        run: |
          python manage.py check

      - name: Run Django deployment check
        env:
          DB_NAME: campus_hiring_db
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: ci-test-secret-key-campus-hiring-platform-32chars
          DEBUG: "False"
        run: |
          python manage.py check --deploy

      - name: Run backend pytest suite
        env:
          DB_NAME: campus_hiring_db
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: ci-test-secret-key-campus-hiring-platform-32chars
          DEBUG: "True"
        run: |
          pytest
