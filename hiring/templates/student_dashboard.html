<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
            text-align:center;
            padding-top:60px;
        }

        .box{
            width:400px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
        }

        h2{
            color:#007BFF;
        }

        p{
            text-align:left;
            margin:12px 20px;
        }

        a{
            text-decoration:none;
            color:white;
            background:#007BFF;
            padding:10px 20px;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Welcome {{ student.name }} 👋</h2>

    <p><b>Name:</b> {{ student.name }}</p>
    <p><b>Email:</b> {{ student.email }}</p>
    <p><b>College:</b> {{ student.college }}</p>
    <p><b>Department:</b> {{ student.department }}</p>
    <p><b>CGPA:</b> {{ student.cgpa }}</p>

    <br>

    <a href="/">Go to Home</a>

</div>

</body>
</html>
