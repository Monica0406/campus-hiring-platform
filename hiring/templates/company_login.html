<!DOCTYPE html>
<html>
<head>
    <title>Company Login</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .container{
            width:350px;
            margin:60px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            text-align:center;
        }

        input{
            width:90%;
            padding:10px;
            margin:8px;
        }

        button{
            width:95%;
            padding:10px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .error{
            color:red;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="container">

<h2>Company Login</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <input type="email" name="email" placeholder="Company Email" required>

    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>

</form>

</div>

</body>
</html>
