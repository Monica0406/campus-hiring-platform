<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .container{
            width:350px;
            margin:80px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            text-align:center;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            width:95%;
            padding:10px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .error{
            color:red;
            font-weight:bold;
            margin-bottom:10px;
        }

        a{
            text-decoration:none;
            color:#007BFF;
        }
    </style>

</head>

<body>

<div class="container">

    <h2>Student Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <br>

    <a href="/">🏠 Back to Home</a>

</div>

</body>
</html>
